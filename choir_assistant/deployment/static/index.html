<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合唱曲库</title><link rel="stylesheet" href="app.css"></head>
<body><header><button id="home" class="brand">♫ 合唱曲库</button><span id="total">正在读取…</span><select id="work-select" aria-label="选择曲目"><option value="">选择曲目</option></select><select id="movement-select" aria-label="选择曲目段落" hidden></select><button id="reload">刷新曲库</button><button id="data-toggle">结构数据</button><button id="feedback-open">反馈</button><a id="github-link" target="_blank" rel="noopener noreferrer" hidden>GitHub ↗</a></header>
<main id="home-view"><div class="intro"><div><span class="eyebrow">SCORE LIBRARY</span><h1 id="library-title">合唱曲库</h1><p>原谱、逐音结构、校对证据与排练工作台，按曲目保存。</p></div><input id="search" type="search" placeholder="搜索曲名或声部…" aria-label="搜索曲库"></div><div id="cards"></div></main>
<div id="notice" role="status" hidden></div><iframe id="workbench" title="所选曲目的乐谱工作台" allow="microphone; autoplay" hidden></iframe>
<section id="data-panel" hidden><div class="data-heading"><h2>结构数据</h2><button id="data-close">关闭</button></div><p id="data-summary"></p><div id="downloads"></div><div class="filters"><select id="part-filter" aria-label="查询声部"></select><input id="measure-filter" type="number" min="1" placeholder="小节" aria-label="查询小节"><button id="query">查询音符</button></div><p id="query-status"></p><div class="table-wrap"><table><thead><tr><th>源 ID</th><th>声部</th><th>小节</th><th>音高</th><th>时值 / 四分拍</th><th>时间 / 秒</th><th>关系</th></tr></thead><tbody id="symbols"></tbody></table></div><p class="fine">数据库保留完整 source / notation / rational / tie / slur / tuplet 与审计数据。这里显示当前查询前 100 个符号。</p></section>
<dialog id="password-dialog" aria-labelledby="password-heading"><form id="password-form"><div class="dialog-heading"><h2 id="password-heading">输入曲目密码</h2><button type="button" id="password-close" aria-label="关闭密码窗口">×</button></div><p id="password-work"></p><label for="work-password">访问密码</label><input id="work-password" type="password" maxlength="256" autocomplete="current-password" required><p id="password-status" class="form-status" role="status"></p><button type="submit" id="password-submit" class="primary">进入曲目</button></form></dialog>
<dialog id="feedback-dialog" aria-labelledby="feedback-heading"><form id="feedback-form"><div class="dialog-heading"><h2 id="feedback-heading">反馈问题</h2><button type="button" id="feedback-close" aria-label="关闭反馈窗口">×</button></div><p>反馈保存在曲库服务器，由维护者查看。请勿填写密码或个人敏感信息。</p><label for="feedback-work">曲目</label><select id="feedback-work"><option value="">首页 / 整体问题</option></select><div class="feedback-position"><label>小节<input id="feedback-measure" maxlength="80" placeholder="例如：第 48 小节"></label><label>播放位置<input id="feedback-position" maxlength="80" placeholder="例如：2:36"></label></div><label for="feedback-text">遇到的问题</label><textarea id="feedback-text" maxlength="4000" rows="5" required placeholder="描述操作步骤、预期结果与实际现象…"></textarea><p id="feedback-status" class="form-status" role="status"></p><button type="submit" id="feedback-submit" class="primary">提交反馈</button></form></dialog>
<script src="app.js"></script></body></html>
